<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>優品360 司機自助取籌平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 頂部標題 -->
    <div class="bg-gradient-to-r from-red-600 to-red-500 text-white py-5 px-4 shadow-lg">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-truck-fast text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold">優品360 司機自助取籌</h1>
                    <p class="text-xs text-red-100">請輸入 PO 單號領取受權碼</p>
                </div>
            </div>
            <div class="text-right text-xs bg-white/20 px-3 py-1.5 rounded-full">
                <i class="fa-regular fa-clock"></i> <span id="live-time">--:--:--</span>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 py-6 space-y-4">
        
        <!-- 同步狀態卡片 -->
        <div id="data-status-card" class="bg-white rounded-xl p-4 shadow-sm border-l-4 border-amber-500">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i id="status-icon" class="fa-solid fa-database text-amber-500"></i>
                    <span id="data-status-text" class="text-sm font-medium">未同步</span>
                </div>
                <button onclick="openSyncModal()" class="bg-blue-500 text-white px-3 py-1 rounded-lg text-xs flex items-center gap-1">
                    <i class="fa-solid fa-keyboard"></i> 輸入同步碼
                </button>
            </div>
            <div id="data-detail" class="text-xs text-gray-400 mt-2">
                請輸入管理端提供嘅4位同步碼
            </div>
        </div>

        <!-- 取籌卡片 -->
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <div class="text-center mb-5">
                <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fa-solid fa-clipboard-list text-red-600 text-3xl"></i>
                </div>
                <h2 class="text-xl font-bold text-gray-800">輸入 PO 單號</h2>
                <p class="text-xs text-gray-500 mt-1">系統會核對預約時段並發放受權碼</p>
            </div>

            <input type="text" id="driver-po" placeholder="例如: EPO260002047" 
                   class="w-full border-2 border-gray-200 rounded-xl p-4 text-center text-lg font-mono uppercase focus:border-red-500 focus:outline-none transition">

            <button onclick="submitQuery()" class="w-full mt-5 bg-red-600 hover:bg-red-700 text-white py-4 rounded-xl font-bold text-lg transition active:scale-95 flex items-center justify-center gap-2">
                <i class="fa-solid fa-key"></i> 核驗並領取受權碼
            </button>

            <!-- 快速測試按鈕 -->
            <div id="test-buttons" class="flex flex-wrap gap-2 justify-center mt-5"></div>
        </div>

        <!-- 結果顯示區域 -->
        <div id="result-area" class="hidden"></div>

        <!-- 提示 -->
        <div class="bg-blue-50 rounded-xl p-3 text-xs text-blue-700 border border-blue-200">
            <div class="flex gap-2">
                <i class="fa-solid fa-circle-info mt-0.5"></i>
                <div>
                    <p class="font-bold">📡 點樣開始？</p>
                    <p class="mt-1">1. 向管理員拎4位同步碼</p>
                    <p class="mt-1">2. 點擊「輸入同步碼」</p>
                    <p class="mt-1">3. 輸入同步碼後即可查詢PO單號</p>
                </div>
            </div>
        </div>

        <div class="text-center text-xs text-gray-400 py-3 border-t">
            <i class="fa-regular fa-clock mr-1"></i> 上午預約任何時間可取碼 · 下午預約需 12:01 後
        </div>
    </div>

    <!-- 同步碼輸入 Modal -->
    <div id="sync-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg">🔑 輸入同步碼</h3>
                <button onclick="closeSyncModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-gray-600 block mb-1">請輸入管理端提供嘅4位同步碼</label>
                    <input type="text" id="sync-code-input" placeholder="例如: A3B9" maxlength="4" 
                           class="w-full border-2 rounded-lg p-4 text-center text-2xl font-mono uppercase tracking-wider focus:border-blue-500 focus:outline-none">
                </div>
                
                <button onclick="syncWithCode()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-rotate"></i> 確認同步
                </button>
                
                <p class="text-xs text-gray-400 text-center">
                    同步碼有效期為5分鐘，請向管理員索取
                </p>
            </div>
            
            <div id="sync-error-msg" class="mt-4 text-xs text-center text-red-500 hidden"></div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-full shadow-lg hidden z-50 text-sm whitespace-nowrap"></div>

    <script>
        // ==================== 全域變數 ====================
        let database = [];
        let authStartAM = "A001";
        let authStartPM = "P001";
        let amCounter = 0;
        let pmCounter = 0;
        let isSynced = false;

        // ==================== 時間顯示 ====================
        function updateTime() {
            let now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString('zh-HK');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ==================== 同步碼驗證（4位）====================
        function syncWithCode() {
            let code = document.getElementById('sync-code-input').value.trim().toUpperCase();
            let errorDiv = document.getElementById('sync-error-msg');
            
            if (code.length !== 4) {
                errorDiv.innerText = '請輸入4位同步碼';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            errorDiv.classList.add('hidden');
            showToast('正在同步資料...');
            
            // 從 localStorage 讀取同步碼對應的資料
            let syncData = localStorage.getItem(`優品360_sync_${code}`);
            
            if (!syncData) {
                errorDiv.innerText = '同步碼無效或已過期，請向管理員重新索取';
                errorDiv.classList.remove('hidden');
                showToast('❌ 同步碼無效或已過期');
                return;
            }
            
            try {
                let data = JSON.parse(syncData);
                
                if (data.database) {
                    database = data.database;
                }
                if (data.authStartAM) {
                    authStartAM = data.authStartAM;
                }
                if (data.authStartPM) {
                    authStartPM = data.authStartPM;
                }
                if (data.amCounter !== undefined) {
                    amCounter = data.amCounter;
                }
                if (data.pmCounter !== undefined) {
                    pmCounter = data.pmCounter;
                }
                
                isSynced = true;
                
                // 更新 UI 顯示
                document.getElementById('data-status-text').innerHTML = '✅ 已同步';
                document.getElementById('status-icon').className = 'fa-solid fa-database text-emerald-500';
                document.getElementById('data-detail').innerHTML = `已載入 ${database.length} 筆預約資料 | 受權碼: ${authStartAM} / ${authStartPM}`;
                document.getElementById('data-status-card').className = 'bg-white rounded-xl p-4 shadow-sm border-l-4 border-emerald-500';
                
                // 更新測試按鈕
                updateTestButtons();
                
                closeSyncModal();
                showToast(`✅ 同步成功！已載入 ${database.length} 筆預約資料`);
                
                // 可選：同步完成後自動刪除這個同步碼（一次性使用）
                // localStorage.removeItem(`優品360_sync_${code}`);
                
            } catch(e) {
                errorDiv.innerText = '資料讀取錯誤，請重新嘗試';
                errorDiv.classList.remove('hidden');
                console.error(e);
            }
        }

        // ==================== 更新測試按鈕 ====================
        function updateTestButtons() {
            let container = document.getElementById('test-buttons');
            if (database.length > 0) {
                let testPOs = database.slice(0, 4).map(d => d.poNo);
                container.innerHTML = testPOs.map(po => `
                    <span onclick="document.getElementById('driver-po').value='${po}';submitQuery()" 
                          class="bg-gray-100 hover:bg-red-100 hover:text-red-600 px-3 py-1.5 rounded-full text-xs font-mono cursor-pointer transition">
                        ${po}
                    </span>
                `).join('');
            } else {
                container.innerHTML = '<span class="text-xs text-gray-400">同步後會顯示測試單號</span>';
            }
        }

        // ==================== 解析時間 ====================
        function parseTimeToHour(timeStr) {
            if (!timeStr) return NaN;
            let str = String(timeStr).trim();
            let isPM = str.includes('下午') || str.includes('PM');
            let numMatch = str.match(/\d+/g);
            if (!numMatch) return NaN;
            let hour = parseInt(numMatch[0]);
            if (isPM && hour < 12) hour += 12;
            if (numMatch[0] && numMatch[0].length === 4) hour = parseInt(numMatch[0].substring(0, 2));
            return hour;
        }

        function formatDisplayTime(raw) {
            if (!raw) return '-';
            let hour = parseTimeToHour(raw);
            if (!isNaN(hour)) return hour + ':00';
            return String(raw);
        }

        // ==================== 獲取下一個受權碼 ====================
        function getNextAuthCode(isPM) {
            if (isPM) {
                pmCounter++;
                let number = pmCounter.toString().padStart(3, '0');
                return `P${number}`;
            } else {
                amCounter++;
                let number = amCounter.toString().padStart(3, '0');
                return `A${number}`;
            }
        }

        // ==================== 提交核驗 ====================
        function submitQuery() {
            let po = document.getElementById('driver-po').value.trim().toUpperCase();
            if (!po) {
                showToast('請輸入 PO 單號');
                return;
            }

            if (!isSynced || database.length === 0) {
                showToast('⚠️ 尚未同步資料，請先輸入同步碼');
                openSyncModal();
                return;
            }

            let record = database.find(d => d.poNo === po);
            let resultDiv = document.getElementById('result-area');
            let now = new Date();
            let currentHour = now.getHours();
            let currentMinute = now.getMinutes();
            let isBefore1201 = (currentHour < 12) || (currentHour === 12 && currentMinute === 0);
            let timeStr = now.toLocaleTimeString('zh-HK');

            // 記錄日誌到 localStorage（供管理端查看）
            function addLog(status, remark) {
                let logs = JSON.parse(localStorage.getItem('優品360_logs') || '[]');
                logs.unshift({ time: timeStr, po: po, status: status, remark: remark });
                if (logs.length > 100) logs.pop();
                localStorage.setItem('優品360_logs', JSON.stringify(logs));
                
                let stats = JSON.parse(localStorage.getItem('優品360_stats') || '{"approved":0,"rejected":0}');
                if (status.includes('核准')) stats.approved++;
                else if (status.includes('拒絕') || status.includes('查無')) stats.rejected++;
                localStorage.setItem('優品360_stats', JSON.stringify(stats));
                localStorage.setItem('優品360_last_update', new Date().toISOString());
            }

            if (!record) {
                resultDiv.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center shadow-lg fade-in">
                        <i class="fa-solid fa-circle-question text-5xl text-gray-400"></i>
                        <p class="mt-3 font-bold text-gray-700">查無此 PO 單號</p>
                        <p class="text-xs text-gray-400 mt-1">請確認單號是否正確</p>
                        <button onclick="closeResult()" class="mt-4 bg-gray-800 text-white px-5 py-2 rounded-lg text-sm">返回</button>
                    </div>
                `;
                resultDiv.classList.remove('hidden');
                addLog('❌ 查無單據', 'PO不在預約列表中');
                return;
            }

            let isPM = record.hour >= 12;
            let authCode = getNextAuthCode(isPM);
            
            // 更新計數器到 localStorage（讓管理端知道）
            localStorage.setItem('優品360_auth_counter', JSON.stringify({ am: amCounter, pm: pmCounter }));

            if (isPM && isBefore1201) {
                resultDiv.innerHTML = `
                    <div class="bg-white rounded-2xl p-6 text-center shadow-lg fade-in">
                        <i class="fa-solid fa-circle-xmark text-5xl text-red-500"></i>
                        <p class="mt-3 font-bold text-red-600">不符合預約時間</p>
                        <p class="text-sm mt-1">下午預約需於中午 12:01 後才能取碼</p>
                        <button onclick="closeResult()" class="mt-4 bg-gray-800 text-white px-5 py-2 rounded-lg text-sm">返回</button>
                    </div>
                `;
                resultDiv.classList.remove('hidden');
                addLog('⏰ 拒絕取籌', '下午單早到 (12:01前)');
                return;
            }

            // 核准
            resultDiv.innerHTML = `
                <div class="bg-white rounded-2xl p-6 text-center shadow-lg fade-in">
                    <i class="fa-solid fa-circle-check text-5xl text-emerald-500"></i>
                    <p class="mt-3 font-bold text-emerald-600">驗證通過</p>
                    <div class="bg-gradient-to-r from-emerald-50 to-teal-50 rounded-2xl p-5 mt-4">
                        <div class="text-xs text-gray-500 tracking-wider">排隊機受權碼</div>
                        <div class="text-5xl font-mono font-bold tracking-wider text-gray-800 my-2">${authCode}</div>
                        <div class="text-[10px] text-gray-400">請於現場排隊機輸入此密碼</div>
                    </div>
                    <div class="mt-4 text-left text-sm bg-gray-50 rounded-xl p-4">
                        <div class="flex justify-between py-1"><span class="text-gray-500">PO 單號：</span><span class="font-mono font-bold">${record.poNo}</span></div>
                        <div class="flex justify-between py-1"><span class="text-gray-500">供應商：</span><span>${record.supplier}</span></div>
                        <div class="flex justify-between py-1"><span class="text-gray-500">預約時間：</span><span>${formatDisplayTime(record.timeVal)}</span></div>
                        <div class="flex justify-between py-1"><span class="text-gray-500">貨板數量：</span><span>${record.pallets} 板</span></div>
                    </div>
                    <button onclick="closeResult()" class="mt-4 bg-emerald-600 text-white px-5 py-2 rounded-lg text-sm w-full">繼續取籌</button>
                </div>
            `;
            resultDiv.classList.remove('hidden');
            addLog('✅ 核准取籌', authCode);
            showToast(`取籌成功！受權碼：${authCode}`);
        }

        function closeResult() {
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('result-area').innerHTML = '';
            document.getElementById('driver-po').value = '';
            document.getElementById('driver-po').focus();
        }

        // ==================== Modal 控制 ====================
        function openSyncModal() {
            document.getElementById('sync-modal').classList.remove('hidden');
            document.getElementById('sync-code-input').value = '';
            document.getElementById('sync-error-msg').classList.add('hidden');
            document.getElementById('sync-code-input').focus();
        }

        function closeSyncModal() {
            document.getElementById('sync-modal').classList.add('hidden');
        }

        // ==================== Toast 提示 ====================
        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }

        // ==================== 檢查是否已有資料 ====================
        function checkExistingData() {
            // 檢查 localStorage 有冇已經同步過嘅資料
            let storedDB = localStorage.getItem('優品360_database');
            if (storedDB && !isSynced) {
                try {
                    database = JSON.parse(storedDB);
                    if (database.length > 0) {
                        isSynced = true;
                        document.getElementById('data-status-text').innerHTML = '✅ 已同步';
                        document.getElementById('status-icon').className = 'fa-solid fa-database text-emerald-500';
                        document.getElementById('data-detail').innerHTML = `已載入 ${database.length} 筆預約資料`;
                        document.getElementById('data-status-card').className = 'bg-white rounded-xl p-4 shadow-sm border-l-4 border-emerald-500';
                        updateTestButtons();
                    }
                } catch(e) {}
            }
        }

        // ==================== 初始化 ====================
        function init() {
            checkExistingData();
            
            // 監聽 Enter 鍵
            document.getElementById('driver-po').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') submitQuery();
            });
            
            // 同步碼輸入框 Enter 鍵
            document.getElementById('sync-code-input').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') syncWithCode();
            });
            
            // 點擊 modal 背景關閉
            document.getElementById('sync-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('sync-modal')) {
                    closeSyncModal();
                }
            });
            
            // 如果沒有同步，自動彈出 modal
            if (!isSynced && database.length === 0) {
                setTimeout(() => {
                    openSyncModal();
                }, 500);
            }
        }

        init();
    </script>
</body>
</html>
